<section class="space-y-4">
  <h2 class="text-lg font-semibold text-slate-900">Employee List</h2>

  <ul class="space-y-2">
    @for (employee of employees$ | async; track employee.id) {
      <li
        class="flex items-center justify-between gap-4 rounded-md border
               border-slate-200 bg-white px-3 py-2"
      >
        <a
          [routerLink]="['/employees', employee.id]"
          class="font-medium text-slate-900 underline-offset-4 hover:underline"
          >{{ employee.firstName }} {{ employee.lastName }}</a
        >
        <span class="text-sm text-slate-500">{{ employee.salary }} zł</span>
      </li>
    } @empty {
      <li class="text-sm text-slate-400">Brak pracowników.</li>
    }
  </ul>
</section>
