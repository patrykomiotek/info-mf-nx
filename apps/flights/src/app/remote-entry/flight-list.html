<section class="space-y-4">
  <h2 class="text-2xl font-semibold text-slate-900">Flights</h2>

  <ul class="space-y-3">
    @for (flight of flights$ | async; track flight.id) {
      <li class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 space-y-1">
            <h3 class="font-medium text-slate-900">
              <a
                [routerLink]="['/flights', flight.id]"
                class="underline-offset-4 hover:underline"
                >{{ flight.name }}</a
              >
            </h3>
            <p class="text-sm text-slate-500">{{ flight.description }}</p>
          </div>
          <span class="shrink-0 font-semibold text-slate-900">
            {{ flight.price }} zł
          </span>
        </div>

        <div class="mt-3 flex items-center gap-3">
          <info-mf-nx-reserve-flight [flight]="flight" />
          <a
            [routerLink]="['/flights', flight.id]"
            class="text-sm font-medium text-slate-500 underline-offset-4 hover:underline"
            >View details</a
          >
        </div>
      </li>
    } @empty {
      <li class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-8
                 text-center text-slate-500">
        Brak lotów. Sprawdź, czy backend działa na porcie 3002.
      </li>
    }
  </ul>
</section>
