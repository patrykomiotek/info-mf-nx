<div class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div
      class="mx-auto flex max-w-5xl items-center gap-6 px-6 py-3"
    >
      <a routerLink="/" class="text-base font-semibold tracking-tight">
        info<span class="text-sky-600">-mf</span>
      </a>

      <nav class="flex flex-1 items-center gap-1">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-slate-100 text-slate-900"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600
                   transition hover:bg-slate-100 hover:text-slate-900"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <a
        routerLink="/cart"
        class="flex items-center gap-2 rounded-md border border-slate-200 px-3
               py-1.5 text-sm font-medium transition hover:border-slate-300
               hover:bg-slate-50"
        [attr.aria-label]="'Koszyk, pozycji: ' + cart.count()"
      >
        <span aria-hidden="true">🛒</span>
        <span>{{ cart.count() }}</span>
        @if (!cart.isEmpty()) {
          <span class="text-slate-400">·</span>
          <span>{{ cart.total() }} zł</span>
        }
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-8">
    <router-outlet />
  </main>
</div>
